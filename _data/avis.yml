# Avis Google — saisis à la main (pas de service tiers, 0 dépendance).
# Pour ajouter un avis : copie un bloc ci-dessous et remplis les champs.
# "date" = date réelle de l'avis au format AAAA-MM-JJ. Le « il y a X mois »
# est calculé automatiquement au build (par rapport à la date de génération),
# donc il se rafraîchit tout seul à chaque déploiement. Pas besoin d'y toucher.
# Le nombre affiché ("Basé sur X avis") et la note viennent de _config.yml
# (google_review_count / google_rating) pour rester cohérents avec tout le site.
