  Encres : OR #E8B547 (or brand) + BLANC #FFFFFF.
  Système de design aligné sur images/social/banner-*.svg (Inter Tight + JetBrains Mono).
  Avant impression : ouvrir dans Illustrator → Sélectionner les textes → "Vectoriser" (Cmd+Shift+O).
-->
