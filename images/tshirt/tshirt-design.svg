<?xml version="1.0" encoding="UTF-8"?>
<!--
  L'artisan 2.0 — Visuel t-shirt DOS (bicolore OR + BLANC sur noir)
  Ordre : WORDMARK L'ARTISAN 2.0 → PICTO (logo intact) → ÉLECTRICITÉ GÉNÉRALE → filet or → services
  → SUIVEZ-NOUS + réseaux (Instagram / LinkedIn / Facebook). Aéré autour du logo, sans URL (QR sur la manche).
  Substrat NOIR. Encres : OR #E8B547→#F2C46E + BLANC #fafaf7. Icônes réseaux = carré or, glyphe en RÉSERVE
  (tissu noir au travers) → 2 encres seulement. PNG d'impression = fond TRANSPARENT.
  Avant impression : ouvrir dans Illustrator → Sélectionner les textes → "Vectoriser" (Cmd+Shift+O).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <defs>
    <style>
      .gold    { fill: url(#goldGrad); }
      .white   { fill: #fafaf7; }
      .display { font-family: "Inter Tight","Inter",-apple-system,system-ui,sans-serif; font-weight: 700; }
    </style>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8B547"/>
      <stop offset="1" stop-color="#F2C46E"/>
    </linearGradient>
    <!-- Réseaux : glyphes en réserve (tissu noir au travers) -->
    <mask id="m-ig" maskUnits="userSpaceOnUse" x="473" y="1270" width="66" height="66">
      <rect x="473" y="1270" width="66" height="66" fill="#fff"/>
      <rect x="488" y="1285" width="36" height="36" rx="11" fill="none" stroke="#000" stroke-width="4.4"/>
      <circle cx="506" cy="1303" r="9.5" fill="none" stroke="#000" stroke-width="4.4"/>
      <circle cx="520.5" cy="1288.5" r="3" fill="#000"/>
    </mask>
    <mask id="m-li" maskUnits="userSpaceOnUse" x="567" y="1270" width="66" height="66">
      <rect x="567" y="1270" width="66" height="66" fill="#fff"/>
      <text x="600" y="1316" text-anchor="middle" class="display" font-size="34" fill="#000">in</text>
    </mask>
    <mask id="m-fb" maskUnits="userSpaceOnUse" x="661" y="1270" width="66" height="66">
      <rect x="661" y="1270" width="66" height="66" fill="#fff"/>
      <text x="694" y="1322" text-anchor="middle" class="display" font-size="54" fill="#000">f</text>
    </mask>
  </defs>

  <!-- WORDMARK : L'ARTISAN (blanc) + 2.0 (or) -->
  <text x="600" y="358" text-anchor="middle" class="display" font-size="126" letter-spacing="-4">
    <tspan class="white">L&#8217;ARTISAN</tspan><tspan class="gold" dx="42">2.0</tspan>
  </text>

  <!-- PICTO (terre) en BLANC — logo intact, centré verticalement entre wordmark et ÉLECTRICITÉ -->
  <g transform="translate(287 331) scale(0.60)" class="white" stroke="#fafaf7" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M522.3,848.2c-13.5,0-27-3.5-39.1-10.4l-199.3-115.1c-24.1-13.9-39.1-39.8-39.1-67.6v-230.1c0-27.8,15-53.7,39.1-67.6l199.3-115.1c24.1-13.9,54-13.9,78.1,0l199.3,115.1c24.1,13.9,39.1,39.8,39.1,67.6v230.1c0,27.8-15,53.7-39.1,67.6l-199.3,115.1c-12,7-25.5,10.4-39.1,10.4ZM522.3,247.9c-10.7,0-21.4,2.8-31,8.3l-199.3,115.1c-19.1,11-31,31.6-31,53.7v230.1c0,22.1,11.9,42.6,31,53.7l199.3,115.1c19.1,11,42.9,11,62,0l199.3-115.1c19.1-11,31-31.6,31-53.7v-230.1c0-22.1-11.9-42.6-31-53.7l-199.3-115.1c-9.6-5.5-20.3-8.3-31-8.3Z"/>
    <path d="M522.3,570c-4.5,0-8.1-3.6-8.1-8.1v-191.9c0-4.5,3.6-8.1,8.1-8.1s8.1,3.6,8.1,8.1v191.9c0,4.5-3.6,8.1-8.1,8.1Z"/>
    <path d="M641.1,618.1h-229.1c-4.5,0-8.1-3.6-8.1-8.1s3.6-8.1,8.1-8.1h229.1c4.5,0,8.1,3.6,8.1,8.1s-3.6,8.1-8.1,8.1Z"/>
    <path d="M607.4,681.9h-161.5c-4.5,0-8.1-3.6-8.1-8.1s3.6-8.1,8.1-8.1h161.5c4.5,0,8.1,3.6,8.1,8.1s-3.6,8.1-8.1,8.1Z"/>
    <path d="M676.4,547.1h-308.2c-4.5,0-8.1-3.6-8.1-8.1s3.6-8.1,8.1-8.1h308.2c4.5,0,8.1,3.6,8.1,8.1s-3.6,8.1-8.1,8.1Z"/>
  </g>

  <!-- SOUS-TITRE : ÉLECTRICITÉ -->
  <text x="600" y="992" text-anchor="middle" class="display white" font-size="56" letter-spacing="14">ÉLECTRICITÉ</text>

  <!-- Filet or séparateur -->
  <rect class="gold" x="515" y="1036" width="170" height="3"/>

  <!-- SERVICES + DOMOTIQUE -->
  <text x="600" y="1110" text-anchor="middle" class="display gold" font-size="28" letter-spacing="2.5">INSTALLATION · RÉNOVATION · DÉPANNAGE · DOMOTIQUE</text>

  <!-- SUIVEZ-NOUS + réseaux (resserrés) -->
  <text x="600" y="1240" text-anchor="middle" class="display white" font-size="26" letter-spacing="4">SUIVEZ-NOUS</text>
  <rect class="gold" x="473" y="1270" width="66" height="66" rx="18" mask="url(#m-ig)"/>
  <rect class="gold" x="567" y="1270" width="66" height="66" rx="18" mask="url(#m-li)"/>
  <rect class="gold" x="661" y="1270" width="66" height="66" rx="18" mask="url(#m-fb)"/>
</svg>
