<?xml version="1.0" encoding="UTF-8"?>
<!--
  L'artisan 2.0 — Visuel CASQUETTE (front panel, broderie ou flex)
  Format landscape 2:1, picto à gauche + wordmark à droite.
  Substrat : casquette NOIRE. Couleurs : OR #E8B547 + BLANC CASSÉ #fafaf7.
  Pour broderie : 3 couleurs max (or, blanc, transparent), simplifié par rapport au t-shirt.
  Avant impression/broderie : ouvrir dans Illustrator → Vectoriser le texte (Cmd+Shift+O).
-->
