<?xml version="1.0" encoding="UTF-8"?>
<!--
  L'artisan 2.0 — CARTE DE VISITE — RECTO (marque + prestations + QR)
  Format 85 x 55 mm + 3 mm de fond perdu = 91 x 61 mm. Unités : 1 = 0,1 mm → artboard 910 x 610.
  Trait de coupe (trim) à 30 ; zone de sécurité ~60 du bord. Liseré-câble doré + balade/embout (signature).
  Typo alignée covering/tshirt : Inter Tight + JetBrains Mono. OR #E8B547 + BLANC #fafaf7 / NOIR #0f0f10.
  Picto = hauteur des 2 lignes (wordmark + sous-titre), aligné verticalement. Vectoriser les textes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 610" width="910" height="610">
  <defs>
    <style>
      .gold    { fill: url(#goldGrad); }
      .white   { fill: #fafaf7; }
      .ink     { fill: #0f0f10; }
      .display { font-family: "Inter Tight","Inter",-apple-system,system-ui,sans-serif; font-weight: 700; }
      .mono    { font-family: "JetBrains Mono","SF Mono",ui-monospace,monospace; font-weight: 500; }
    </style>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8B547"/>
      <stop offset="1" stop-color="#F2C46E"/>
    </linearGradient>
  </defs>

  <!-- Fond perdu (full bleed) -->
  <rect class="ink" x="0" y="0" width="910" height="610"/>

  <!-- Liseré-câble doré (même design que la caisse) : il fait le tour, rentre et se balade jusqu'à l'embout -->
  <path d="M846 219 V530 A16 16 0 0 1 830 546 H80 A16 16 0 0 1 64 530 V80 A16 16 0 0 1 80 64 H830 A16 16 0 0 1 846 80 V138 A12 12 0 0 1 834 150
           C810 150 773 157 777 188 C780 210 815 214 822 192 C828 174 808 165 801 184 C796 198 810 205 805 223"
        fill="none" stroke="#E8B547" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="846" cy="219" r="3.5" fill="#E8B547"/>
  <!-- embout de câble (prise) — même embout que covering/arrière -->
  <g transform="translate(805 223) rotate(75)" fill="#E8B547">
    <rect x="0" y="-9" width="17" height="18" rx="5"/>
    <rect x="17" y="-6" width="9" height="3.6" rx="1.8"/>
    <rect x="17" y="2.4" width="9" height="3.6" rx="1.8"/>
    <circle cx="7.5" cy="0" r="1.8" class="ink"/>
  </g>

  <!-- PICTO (terre) : hauteur des 2 lignes, à gauche du wordmark -->
  <g transform="translate(142 148) scale(0.135)" class="white" stroke="#fafaf7" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M522.3,848.2c-13.5,0-27-3.5-39.1-10.4l-199.3-115.1c-24.1-13.9-39.1-39.8-39.1-67.6v-230.1c0-27.8,15-53.7,39.1-67.6l199.3-115.1c24.1-13.9,54-13.9,78.1,0l199.3,115.1c24.1,13.9,39.1,39.8,39.1,67.6v230.1c0,27.8-15,53.7-39.1,67.6l-199.3,115.1c-12,7-25.5,10.4-39.1,10.4ZM522.3,247.9c-10.7,0-21.4,2.8-31,8.3l-199.3,115.1c-19.1,11-31,31.6-31,53.7v230.1c0,22.1,11.9,42.6,31,53.7l199.3,115.1c19.1,11,42.9,11,62,0l199.3-115.1c19.1-11,31-31.6,31-53.7v-230.1c0-22.1-11.9-42.6-31-53.7l-199.3-115.1c-9.6-5.5-20.3-8.3-31-8.3Z"/>
    <path d="M522.3,570c-4.5,0-8.1-3.6-8.1-8.1v-191.9c0-4.5,3.6-8.1,8.1-8.1s8.1,3.6,8.1,8.1v191.9c0,4.5-3.6,8.1-8.1,8.1Z"/>
    <path d="M641.1,618.1h-229.1c-4.5,0-8.1-3.6-8.1-8.1s3.6-8.1,8.1-8.1h229.1c4.5,0,8.1,3.6,8.1,8.1s-3.6,8.1-8.1,8.1Z"/>
    <path d="M607.4,681.9h-161.5c-4.5,0-8.1-3.6-8.1-8.1s3.6-8.1,8.1-8.1h161.5c4.5,0,8.1,3.6,8.1,8.1s-3.6,8.1-8.1,8.1Z"/>
    <path d="M676.4,547.1h-308.2c-4.5,0-8.1-3.6-8.1-8.1s3.6-8.1,8.1-8.1h308.2c4.5,0,8.1,3.6,8.1,8.1s-3.6,8.1-8.1,8.1Z"/>
  </g>

  <!-- WORDMARK + SOUS-TITRE (les 2 lignes) -->
  <text x="504" y="225" text-anchor="middle" class="display" font-size="60" letter-spacing="-3">
    <tspan class="white">L&#8217;ARTISAN</tspan><tspan class="gold" dx="14">2.0</tspan>
  </text>
  <text x="504" y="260" text-anchor="middle" class="display white" font-size="21" letter-spacing="5">ÉLECTRICITÉ GÉNÉRALE</text>

  <!-- PRESTATIONS (comme sur la caisse) -->
  <text x="455" y="315" text-anchor="middle" class="display gold" font-size="17" letter-spacing="1.5">INSTALLATION · RÉNOVATION · DÉPANNAGE · MISE AUX NORMES</text>

  <!-- Séparateur -->
  <rect class="gold" x="395" y="356" width="120" height="2.5"/>

  <!-- CONTACT (centré) -->
  <text x="455" y="420" text-anchor="middle" class="display gold" font-size="44" letter-spacing="1">06 49 92 78 41</text>
  <text x="455" y="466" text-anchor="middle" class="mono white" font-size="24" letter-spacing="1">contact@lartisan20.fr</text>
</svg>
