<?xml version="1.0" encoding="UTF-8"?>
<!--
  L'artisan 2.0 — CARTE DE VISITE — VERSO (coordonnées + QR)
  Format 85 x 55 mm + 3 mm de fond perdu = 91 x 61 mm. Unités : 1 = 0,1 mm → artboard 910 x 610.
  Trait de coupe (trim) à 30 ; zone de sécurité ~60 du bord.
  Typo alignée covering/tshirt : Inter Tight + JetBrains Mono. OR #E8B547 + BLANC #fafaf7 / NOIR #0f0f10.
  NB : "Électricité générale" comme activité (positionnement reconversion non affiché ici). Vectoriser les textes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 610" width="910" height="610">
  <defs>
    <style>
      .gold    { fill: url(#goldGrad); }
      .white   { fill: #fafaf7; }
      .ink     { fill: #0f0f10; }
      .display { font-family: "Inter Tight","Inter",-apple-system,system-ui,sans-serif; font-weight: 700; }
      .mono    { font-family: "JetBrains Mono","SF Mono",ui-monospace,monospace; font-weight: 500; }
    </style>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8B547"/>
      <stop offset="1" stop-color="#F2C46E"/>
    </linearGradient>
  </defs>

  <!-- Fond perdu (full bleed) -->
  <rect class="ink" x="0" y="0" width="910" height="610"/>

  <!-- Liseré-câble doré qui fait le tour -->
  <rect x="64" y="64" width="782" height="482" rx="16" fill="none" stroke="#E8B547" stroke-width="3"/>

  <!-- Wordmark (petit) -->
  <text x="104" y="150" class="display" font-size="44" letter-spacing="-2">
    <tspan class="white">L&#8217;ARTISAN</tspan><tspan class="gold" dx="10">2.0</tspan>
  </text>

  <!-- Identité -->
  <text x="106" y="232" class="display white" font-size="36" letter-spacing="-0.5">Mathieu Marchois</text>
  <text x="108" y="266" class="display gold" font-size="19" letter-spacing="3">ÉLECTRICITÉ GÉNÉRALE</text>

  <!-- Filet -->
  <rect class="gold" x="108" y="292" width="120" height="2.5"/>

  <!-- Coordonnées -->
  <text x="106" y="356" class="display gold" font-size="34" letter-spacing="1">06 49 92 78 41</text>
  <text x="108" y="402" class="mono white" font-size="23" letter-spacing="1">contact@lartisan20.fr</text>
  <text x="108" y="440" class="mono white" font-size="23" letter-spacing="1">www.lartisan20.fr</text>

  <!-- Réseaux sociaux -->
  <g transform="translate(108 470)">
    <g transform="translate(0 0)">
      <rect width="38" height="38" rx="10" class="gold"/>
      <rect x="8.5" y="8.5" width="21" height="21" rx="6.5" fill="none" stroke="#0f0f10" stroke-width="2.5"/>
      <circle cx="19" cy="19" r="5.7" fill="none" stroke="#0f0f10" stroke-width="2.5"/>
      <circle cx="27" cy="11" r="1.8" class="ink"/>
    </g>
    <g transform="translate(50 0)">
      <rect width="38" height="38" rx="10" class="gold"/>
      <text x="19" y="27" text-anchor="middle" class="display ink" font-size="18">in</text>
    </g>
    <g transform="translate(100 0)">
      <rect width="38" height="38" rx="10" class="gold"/>
      <text x="19" y="29" text-anchor="middle" class="display ink" font-size="28">f</text>
    </g>
  </g>

  <!-- QR + label, centrés verticalement sur la carte -->
  <g transform="translate(585 200)">
    <rect class="white" x="0" y="0" width="230" height="230" rx="18"/>
    <rect x="0" y="0" width="230" height="230" rx="18" fill="none" stroke="#E8B547" stroke-width="3"/>
    <g transform="translate(27.8788 27.8788) scale(6.96970)" shape-rendering="crispEdges">
      <path fill="#0f0f10" d="M0 0h7v1h-7zM9 0h1v1h-1zM14 0h1v1h-1zM18 0h7v1h-7zM0 1h1v1h-1zM6 1h1v1h-1zM9 1h2v1h-2zM15 1h1v1h-1zM18 1h1v1h-1zM24 1h1v1h-1zM0 2h1v1h-1zM2 2h3v1h-3zM6 2h1v1h-1zM8 2h1v1h-1zM18 2h1v1h-1zM20 2h3v1h-3zM24 2h1v1h-1zM0 3h1v1h-1zM2 3h3v1h-3zM6 3h1v1h-1zM8 3h3v1h-3zM13 3h1v1h-1zM15 3h2v1h-2zM18 3h1v1h-1zM20 3h3v1h-3zM24 3h1v1h-1zM0 4h1v1h-1zM2 4h3v1h-3zM6 4h1v1h-1zM8 4h1v1h-1zM11 4h1v1h-1zM13 4h1v1h-1zM18 4h1v1h-1zM20 4h3v1h-3zM24 4h1v1h-1zM0 5h1v1h-1zM6 5h1v1h-1zM8 5h2v1h-2zM11 5h1v1h-1zM13 5h3v1h-3zM18 5h1v1h-1zM24 5h1v1h-1zM0 6h7v1h-7zM8 6h1v1h-1zM10 6h1v1h-1zM12 6h1v1h-1zM14 6h1v1h-1zM16 6h1v1h-1zM18 6h7v1h-7zM8 7h3v1h-3zM12 7h1v1h-1zM16 7h1v1h-1zM0 8h1v1h-1zM2 8h5v1h-5zM9 8h1v1h-1zM12 8h3v1h-3zM18 8h5v1h-5zM1 9h2v1h-2zM5 9h1v1h-1zM7 9h1v1h-1zM12 9h1v1h-1zM16 9h1v1h-1zM19 9h1v1h-1zM23 9h1v1h-1zM0 10h1v1h-1zM2 10h2v1h-2zM6 10h2v1h-2zM9 10h2v1h-2zM12 10h5v1h-5zM18 10h1v1h-1zM21 10h1v1h-1zM23 10h2v1h-2zM0 11h2v1h-2zM3 11h2v1h-2zM10 11h1v1h-1zM12 11h1v1h-1zM15 11h1v1h-1zM17 11h4v1h-4zM24 11h1v1h-1zM2 12h6v1h-6zM10 12h2v1h-2zM13 12h3v1h-3zM17 12h2v1h-2zM20 12h1v1h-1zM22 12h3v1h-3zM0 13h2v1h-2zM3 13h1v1h-1zM8 13h2v1h-2zM12 13h1v1h-1zM14 13h1v1h-1zM16 13h2v1h-2zM19 13h1v1h-1zM21 13h1v1h-1zM23 13h1v1h-1zM0 14h1v1h-1zM3 14h1v1h-1zM5 14h2v1h-2zM10 14h1v1h-1zM13 14h1v1h-1zM15 14h2v1h-2zM18 14h4v1h-4zM23 14h2v1h-2zM0 15h1v1h-1zM2 15h2v1h-2zM7 15h1v1h-1zM10 15h1v1h-1zM12 15h1v1h-1zM19 15h2v1h-2zM24 15h1v1h-1zM0 16h1v1h-1zM3 16h4v1h-4zM12 16h1v1h-1zM15 16h6v1h-6zM22 16h1v1h-1zM8 17h1v1h-1zM10 17h1v1h-1zM16 17h1v1h-1zM20 17h2v1h-2zM0 18h7v1h-7zM9 18h1v1h-1zM11 18h2v1h-2zM16 18h1v1h-1zM18 18h1v1h-1zM20 18h1v1h-1zM22 18h3v1h-3zM0 19h1v1h-1zM6 19h1v1h-1zM8 19h1v1h-1zM11 19h1v1h-1zM16 19h1v1h-1zM20 19h2v1h-2zM23 19h2v1h-2zM0 20h1v1h-1zM2 20h3v1h-3zM6 20h1v1h-1zM8 20h1v1h-1zM11 20h1v1h-1zM15 20h6v1h-6zM22 20h3v1h-3zM0 21h1v1h-1zM2 21h3v1h-3zM6 21h1v1h-1zM8 21h1v1h-1zM10 21h1v1h-1zM12 21h2v1h-2zM17 21h2v1h-2zM20 21h5v1h-5zM0 22h1v1h-1zM2 22h3v1h-3zM6 22h1v1h-1zM8 22h2v1h-2zM13 22h5v1h-5zM21 22h2v1h-2zM24 22h1v1h-1zM0 23h1v1h-1zM6 23h1v1h-1zM9 23h1v1h-1zM12 23h2v1h-2zM15 23h7v1h-7zM24 23h1v1h-1zM0 24h7v1h-7zM8 24h3v1h-3zM12 24h1v1h-1zM14 24h1v1h-1zM18 24h7v1h-7z"/>
    </g>
    <text x="115" y="-16" text-anchor="middle" class="display gold" font-size="22" letter-spacing="2">SCANNEZ-MOI</text>
  </g>
</svg>
