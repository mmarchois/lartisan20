  </defs>

  <!-- Background charbon -->
  <rect width="1640" height="624" fill="#0f0f10"/>
  <rect width="1640" height="624" fill="url(#glow)"/>
  <rect x="0" y="0" width="1640" height="1" fill="url(#topLine)"/>

  <!-- Eyebrow -->
  <text x="140" y="180"
        font-family="JetBrains Mono, ui-monospace, monospace"
        font-size="20" letter-spacing="4" font-weight="500"
