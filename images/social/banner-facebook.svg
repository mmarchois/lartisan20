<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 624" width="1640" height="624">
  <defs>
    <radialGradient id="glow" cx="80%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#E8B547" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#E8B547" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#E8B547" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8B547" stop-opacity="0"/>
      <stop offset="20%" stop-color="#E8B547" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#E8B547" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E8B547" stop-opacity="0"/>
