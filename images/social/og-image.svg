<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="82%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#E8B547" stop-opacity="0.12"/>
      <stop offset="55%" stop-color="#E8B547" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#E8B547" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8B547" stop-opacity="0"/>
      <stop offset="20%" stop-color="#E8B547" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#E8B547" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E8B547" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="botLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8B547" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E8B547" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E8B547" stop-opacity="0"/>
    </linearGradient>
    <!-- Dégradé or brand (aligné carte / covering / t-shirt) -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8B547"/>
      <stop offset="1" stop-color="#F2C46E"/>
    </linearGradient>
  </defs>

  <!-- Background charbon -->
  <rect width="1200" height="630" fill="#0f0f10"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="1" fill="url(#topLine)"/>
  <rect x="0" y="629" width="1200" height="1" fill="url(#botLine)"/>

  <!-- CÂBLE signature (style hero) : terminal → coude arrondi → descente → boucle → prise -->
