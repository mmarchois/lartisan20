<?xml version="1.0" encoding="UTF-8"?>
<!--
  L'artisan 2.0 — COVERING Urban Arrow Cargo XL — CÔTÉ DROIT
  Silhouette = caisse Urban Arrow : hexagone symétrique (dessus large, 2 coins bas chanfreinés).
  Typo alignée sur images/tshirt : Inter Tight + JetBrains Mono. OR #E8B547 + BLANC #fafaf7 / NOIR #0f0f10.
  Wordmark + ÉLECTRICITÉ GÉNÉRALE CENTRÉS. Picto flottant ferré à gauche, équilibré par le QR bas-droite.
  Câble doré FIN qui fait le tour. Ligne réseaux en bas. Artboard indicatif 1200 x 760 — À MESURER.
  Vectoriser les textes avant impression.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs>
    <style>
      .gold    { fill: url(#goldGrad); }
      .white   { fill: #fafaf7; }
      .ink     { fill: #0f0f10; }
      .display { font-family: "Inter Tight","Inter",-apple-system,system-ui,sans-serif; font-weight: 700; }
      .mono    { font-family: "JetBrains Mono","SF Mono",ui-monospace,monospace; font-weight: 500; }
    </style>
    <!-- Silhouette de la caisse : hexagone symétrique, 2 coins bas chanfreinés -->
    <clipPath id="caisse">
      <path d="M20 0 H1180 A20 20 0 0 1 1200 20 V380 L1028 760 H172 L0 380 V20 A20 20 0 0 1 20 0 Z"/>
    </clipPath>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8B547"/>
      <stop offset="1" stop-color="#F2C46E"/>
    </linearGradient>
  </defs>

  <!-- Fond noir découpé à la forme de la caisse -->
  <g clip-path="url(#caisse)">
    <rect class="ink" x="0" y="0" width="1200" height="760"/>
  </g>

  <!-- CÂBLE doré FIN qui fait le tour de la caisse ; sur le flanc droit il rentre et se balade jusqu'à l'embout -->
  <path d="M1184 312 V384 L1022 744 H178 L16 384 V28 A12 12 0 0 1 28 16 H1172 A12 12 0 0 1 1184 28 V214
           C1132 214 1080 224 1086 268 C1090 300 1140 306 1150 274 C1158 248 1130 236 1120 262
           C1112 282 1132 292 1126 318"
        fill="none" stroke="#E8B547" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- petit terminal de départ du câble (sur le liseré) -->
  <circle cx="1184" cy="312" r="4.5" fill="#E8B547"/>
  <!-- embout de câble (prise) au bout de la balade — même embout que l'arrière -->
  <g transform="translate(1126 318) rotate(75)" fill="#E8B547">
    <rect x="0" y="-13" width="24" height="26" rx="7"/>
    <rect x="24" y="-8" width="13" height="5.5" rx="2.7"/>
    <rect x="24" y="3" width="13" height="5.5" rx="2.7"/>
    <circle cx="11" cy="0" r="2.6" class="ink"/>
  </g>

  <!-- CONTENU (échelle réduite pour de meilleures proportions / marges autour) -->
  <g transform="translate(600 380) scale(0.85) translate(-600 -380)">

  <!-- PICTO (terre) ferré à gauche : hauteur = les 2 lignes (wordmark + sous-titre), centré verticalement -->
  <g transform="translate(10 39) scale(0.237)" class="white" stroke="#fafaf7" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M522.3,848.2c-13.5,0-27-3.5-39.1-10.4l-199.3-115.1c-24.1-13.9-39.1-39.8-39.1-67.6v-230.1c0-27.8,15-53.7,39.1-67.6l199.3-115.1c24.1-13.9,54-13.9,78.1,0l199.3,115.1c24.1,13.9,39.1,39.8,39.1,67.6v230.1c0,27.8-15,53.7-39.1,67.6l-199.3,115.1c-12,7-25.5,10.4-39.1,10.4ZM522.3,247.9c-10.7,0-21.4,2.8-31,8.3l-199.3,115.1c-19.1,11-31,31.6-31,53.7v230.1c0,22.1,11.9,42.6,31,53.7l199.3,115.1c19.1,11,42.9,11,62,0l199.3-115.1c19.1-11,31-31.6,31-53.7v-230.1c0-22.1-11.9-42.6-31-53.7l-199.3-115.1c-9.6-5.5-20.3-8.3-31-8.3Z"/>
    <path d="M522.3,570c-4.5,0-8.1-3.6-8.1-8.1v-191.9c0-4.5,3.6-8.1,8.1-8.1s8.1,3.6,8.1,8.1v191.9c0,4.5-3.6,8.1-8.1,8.1Z"/>
    <path d="M641.1,618.1h-229.1c-4.5,0-8.1-3.6-8.1-8.1s3.6-8.1,8.1-8.1h229.1c4.5,0,8.1,3.6,8.1,8.1s-3.6,8.1-8.1,8.1Z"/>
    <path d="M607.4,681.9h-161.5c-4.5,0-8.1-3.6-8.1-8.1s3.6-8.1,8.1-8.1h161.5c4.5,0,8.1,3.6,8.1,8.1s-3.6,8.1-8.1,8.1Z"/>
    <path d="M676.4,547.1h-308.2c-4.5,0-8.1-3.6-8.1-8.1s3.6-8.1,8.1-8.1h308.2c4.5,0,8.1,3.6,8.1,8.1s-3.6,8.1-8.1,8.1Z"/>
  </g>

  <!-- WORDMARK centré -->
  <text x="600" y="165" text-anchor="middle" class="display" font-size="92" letter-spacing="-3.5">
    <tspan class="white">L&#8217;ARTISAN</tspan><tspan class="gold" dx="22">2.0</tspan>
  </text>
  <!-- SOUS-TITRE centré -->
  <text x="600" y="240" text-anchor="middle" class="display white" font-size="41" letter-spacing="6">ÉLECTRICITÉ GÉNÉRALE</text>
  <rect class="gold" x="520" y="281" width="160" height="3"/>

  <!-- PRESTATIONS -->
  <text x="600" y="345" text-anchor="middle" class="display gold" font-size="26" letter-spacing="2.8">INSTALLATION · RÉNOVATION · DÉPANNAGE · MISE AUX NORMES</text>

  <!-- CONTACT (centré, à gauche du QR) -->
  <text x="500" y="470" text-anchor="middle" class="display gold" font-size="82" letter-spacing="1">06 49 92 78 41</text>
  <text x="500" y="525" text-anchor="middle" class="mono white" font-size="32" letter-spacing="3">contact@lartisan20.fr</text>

  <!-- RÉSEAUX SOCIAUX -->
  <text x="500" y="592" text-anchor="middle" class="display white" font-size="18" letter-spacing="3" opacity="0.9">SUIVEZ-NOUS</text>
  <g transform="translate(428 608)">
    <!-- Instagram -->
    <g transform="translate(0 0)">
      <rect width="40" height="40" rx="11" class="gold"/>
      <rect x="9" y="9" width="22" height="22" rx="7" fill="none" stroke="#0f0f10" stroke-width="2.6"/>
      <circle cx="20" cy="20" r="6" fill="none" stroke="#0f0f10" stroke-width="2.6"/>
      <circle cx="28.5" cy="11.5" r="1.9" class="ink"/>
    </g>
    <!-- LinkedIn -->
    <g transform="translate(52 0)">
      <rect width="40" height="40" rx="11" class="gold"/>
      <text x="20" y="29" text-anchor="middle" class="display ink" font-size="19" letter-spacing="0">in</text>
    </g>
    <!-- Facebook -->
    <g transform="translate(104 0)">
      <rect width="40" height="40" rx="11" class="gold"/>
      <text x="20" y="31" text-anchor="middle" class="display ink" font-size="30">f</text>
    </g>
  </g>

  <!-- QR décentré (bas-droite) -->
  <g transform="translate(880 452)">
    <rect class="white" x="0" y="0" width="170" height="170" rx="16"/>
    <rect x="0" y="0" width="170" height="170" rx="16" fill="none" stroke="#E8B547" stroke-width="3"/>
    <g transform="translate(20.6061 20.6061) scale(5.15152)" shape-rendering="crispEdges">
      <path fill="#0f0f10" d="M0 0h7v1h-7zM9 0h1v1h-1zM14 0h1v1h-1zM18 0h7v1h-7zM0 1h1v1h-1zM6 1h1v1h-1zM9 1h2v1h-2zM15 1h1v1h-1zM18 1h1v1h-1zM24 1h1v1h-1zM0 2h1v1h-1zM2 2h3v1h-3zM6 2h1v1h-1zM8 2h1v1h-1zM18 2h1v1h-1zM20 2h3v1h-3zM24 2h1v1h-1zM0 3h1v1h-1zM2 3h3v1h-3zM6 3h1v1h-1zM8 3h3v1h-3zM13 3h1v1h-1zM15 3h2v1h-2zM18 3h1v1h-1zM20 3h3v1h-3zM24 3h1v1h-1zM0 4h1v1h-1zM2 4h3v1h-3zM6 4h1v1h-1zM8 4h1v1h-1zM11 4h1v1h-1zM13 4h1v1h-1zM18 4h1v1h-1zM20 4h3v1h-3zM24 4h1v1h-1zM0 5h1v1h-1zM6 5h1v1h-1zM8 5h2v1h-2zM11 5h1v1h-1zM13 5h3v1h-3zM18 5h1v1h-1zM24 5h1v1h-1zM0 6h7v1h-7zM8 6h1v1h-1zM10 6h1v1h-1zM12 6h1v1h-1zM14 6h1v1h-1zM16 6h1v1h-1zM18 6h7v1h-7zM8 7h3v1h-3zM12 7h1v1h-1zM16 7h1v1h-1zM0 8h1v1h-1zM2 8h5v1h-5zM9 8h1v1h-1zM12 8h3v1h-3zM18 8h5v1h-5zM1 9h2v1h-2zM5 9h1v1h-1zM7 9h1v1h-1zM12 9h1v1h-1zM16 9h1v1h-1zM19 9h1v1h-1zM23 9h1v1h-1zM0 10h1v1h-1zM2 10h2v1h-2zM6 10h2v1h-2zM9 10h2v1h-2zM12 10h5v1h-5zM18 10h1v1h-1zM21 10h1v1h-1zM23 10h2v1h-2zM0 11h2v1h-2zM3 11h2v1h-2zM10 11h1v1h-1zM12 11h1v1h-1zM15 11h1v1h-1zM17 11h4v1h-4zM24 11h1v1h-1zM2 12h6v1h-6zM10 12h2v1h-2zM13 12h3v1h-3zM17 12h2v1h-2zM20 12h1v1h-1zM22 12h3v1h-3zM0 13h2v1h-2zM3 13h1v1h-1zM8 13h2v1h-2zM12 13h1v1h-1zM14 13h1v1h-1zM16 13h2v1h-2zM19 13h1v1h-1zM21 13h1v1h-1zM23 13h1v1h-1zM0 14h1v1h-1zM3 14h1v1h-1zM5 14h2v1h-2zM10 14h1v1h-1zM13 14h1v1h-1zM15 14h2v1h-2zM18 14h4v1h-4zM23 14h2v1h-2zM0 15h1v1h-1zM2 15h2v1h-2zM7 15h1v1h-1zM10 15h1v1h-1zM12 15h1v1h-1zM19 15h2v1h-2zM24 15h1v1h-1zM0 16h1v1h-1zM3 16h4v1h-4zM12 16h1v1h-1zM15 16h6v1h-6zM22 16h1v1h-1zM8 17h1v1h-1zM10 17h1v1h-1zM16 17h1v1h-1zM20 17h2v1h-2zM0 18h7v1h-7zM9 18h1v1h-1zM11 18h2v1h-2zM16 18h1v1h-1zM18 18h1v1h-1zM20 18h1v1h-1zM22 18h3v1h-3zM0 19h1v1h-1zM6 19h1v1h-1zM8 19h1v1h-1zM11 19h1v1h-1zM16 19h1v1h-1zM20 19h2v1h-2zM23 19h2v1h-2zM0 20h1v1h-1zM2 20h3v1h-3zM6 20h1v1h-1zM8 20h1v1h-1zM11 20h1v1h-1zM15 20h6v1h-6zM22 20h3v1h-3zM0 21h1v1h-1zM2 21h3v1h-3zM6 21h1v1h-1zM8 21h1v1h-1zM10 21h1v1h-1zM12 21h2v1h-2zM17 21h2v1h-2zM20 21h5v1h-5zM0 22h1v1h-1zM2 22h3v1h-3zM6 22h1v1h-