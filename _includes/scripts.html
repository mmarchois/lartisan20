<script>
    // Reveal on scroll
    function reveal() {
        const reveals = document.querySelectorAll('.reveal');
        reveals.forEach(element => {
            const windowHeight = window.innerHeight;
            const elementTop = element.getBoundingClientRect().top;
            const elementVisible = 150;
            if (elementTop < windowHeight - elementVisible) {
                element.classList.add('active');
            }
        });
    }
    window.addEventListener('scroll', reveal);
    window.addEventListener('load', reveal);

    // Close mobile menu on link click
    document.querySelectorAll('.mobile-menu a').forEach(link => {
        link.addEventListener('click', () => {
            document.getElementById('menu-toggle').checked = false;
        });
    });

    // Keyboard navigation for dropdown
    const dropdown = document.querySelector('.nav-dropdown');
    if (dropdown) {
        const trigger = dropdown.querySelector('.nav-dropdown-trigger');
        const menu = dropdown.querySelector('.nav-dropdown-menu');
        const menuLinks = menu ? menu.querySelectorAll('a') : [];

        // Escape key closes dropdown and returns focus to trigger
        dropdown.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                trigger.focus();
                trigger.blur();
            }
            // Arrow down from trigger opens menu and focuses first link
            if (e.key === 'ArrowDown' && document.activeElement === trigger) {
                e.preventDefault();
                if (menuLinks.length > 0) menuLinks[0].focus();
            }
        });

        // Arrow navigation within menu items
        menuLinks.forEach((link, index) => {
            link.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (index < menuLinks.length - 1) menuLinks[index + 1].focus();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (index > 0) menuLinks[index - 1].focus();
                    else trigger.focus();
                }
            });
        });
    }

    // Navigation scroll effect
    const nav = document.querySelector('nav');
    window.addEventListener('scroll', () => {
        if (window.scrollY > 50) {
            nav.classList.add('scrolled');
        } else {
            nav.classList.remove('scrolled');
        }
    });

    // Hero de la home : à la suite du filet doré, « Par exemple » fait défiler des savoir-faire
    // (liste dans l'attribut data-exemples de .home-hero__proof, séparés par des barres).
    (function () {
        const proof = document.querySelector('.home-hero__proof');
        const word = proof && proof.querySelector('.home-hero__proof-word');
        if (!word) return;

        const examples = (proof.dataset.exemples || '').split('|').map(text => text.trim()).filter(Boolean);
        // Mouvement réduit : le premier exemple reste affiché.
        if (examples.length < 2 || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

        const hero = proof.closest('.home-hero');
        let index = 0;
        let visible = true;

        // Pas de défilement quand le hero est hors de l'écran.
        if ('IntersectionObserver' in window && hero) {
            new IntersectionObserver(entries => { visible = entries[0].isIntersecting; }).observe(hero);
        }

        setInterval(() => {
            if (!visible || document.hidden) return;
            word.classList.add('is-out');                    // l'exemple en cours sort par le haut
            setTimeout(() => {
                index = (index + 1) % examples.length;
                word.textContent = examples[index];
                word.classList.remove('is-out');
                word.classList.add('is-in');                 // le suivant se place en bas, sans transition
                void word.offsetWidth;                       // position de départ prise en compte
                word.classList.remove('is-in');              // puis il monte à sa place
            }, 320);
        }, 2600);
    })();

    // Carrousel (prestations + réalisations)
    document.querySelectorAll('.prestation-carousel, .realisation-slider').forEach(carousel => {
        const slides = carousel.querySelector('.carousel-slides');
        const slideItems = carousel.querySelectorAll('.carousel-slide');
        const prevBtn = carousel.querySelector('.carousel-prev');
        const nextBtn = carousel.querySelector('.carousel-next');
        const dotsContainer = carousel.querySelector('.carousel-dots');

        if (!slides || slideItems.length === 0) return;

        let currentIndex = 0;
        const totalSlides = slideItems.length;

        // Créer les dots
        slideItems.forEach((_, index) => {
            const dot = document.createElement('button');
            dot.classList.add('carousel-dot');
            if (index === 0) dot.classList.add('active');
            dot.setAttribute('aria-label', `Image ${index + 1}`);
            dot.addEventListener('click', () => goToSlide(index));
            dotsContainer.appendChild(dot);
        });

        const dots = carousel.querySelectorAll('.carousel-dot');

        function goToSlide(index) {
            currentIndex = index;
            slides.style.transform = `translateX(-${currentIndex * 100}%)`;
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === currentIndex);
            });
        }

        function nextSlide() {
            goToSlide((currentIndex + 1) % totalSlides);
        }

        function prevSlide() {
            goToSlide((currentIndex - 1 + totalSlides) % totalSlides);
        }

        if (prevBtn) prevBtn.addEventListener('click', prevSlide);
        if (nextBtn) nextBtn.addEventListener('click', nextSlide);

        // Auto-play uniquement pour les carousels prestations (pas les réalisations)
        if (!carousel.classList.contains('realisation-slider')) {
            setInterval(nextSlide, 5000);
        }
    });

    // Carrousel avis Google (défilement horizontal + flèches)
    document.querySelectorAll('.gr-carousel').forEach(carousel => {
        const track = carousel.querySelector('.gr-track');
        const prevBtn = carousel.querySelector('.gr-nav--prev');
        const nextBtn = carousel.querySelector('.gr-nav--next');
        if (!track) return;

        function step() {
            const card = track.querySelector('.gr-card');
            if (!card) return track.clientWidth;
            const gap = parseFloat(getComputedStyle(track).columnGap) || 0;
            return card.offsetWidth + gap;
        }

        function updateButtons() {
            const max = track.scrollWidth - track.clientWidth - 1;
            if (prevBtn) prevBtn.disabled = track.scrollLeft <= 0;
            if (nextBtn) nextBtn.disabled = track.scrollLeft >= max;
        }

        if (prevBtn) prevBtn.addEventListener('click', () => track.scrollBy({ left: -step(), behavior: 'smooth' }));
        if (nextBtn) nextBtn.addEventListener('click', () => track.scrollBy({ left: step(), behavior: 'smooth' }));
        track.addEventListener('scroll', updateButtons, { passive: true });
        window.addEventListener('resize', updateButtons);
        updateButtons();
    });

    // Retour en haut
    const backToTop = document.getElementById('back-to-top');
    if (backToTop) {
        window.addEventListener('scroll', () => {
            backToTop.classList.toggle('visible', window.scrollY > 400);
        });
        backToTop.addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('main-content').focus({ preventScroll: true });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    }

    // Lightbox : photos de la galerie (et cartes réalisations le cas échéant)
    const lightboxEl = document.getElementById('lightbox');
    if (lightboxEl) {
        const triggers = Array.from(document.querySelectorAll('.galerie-item__zoom, .realisation-slider .carousel-slide img'));
        const imgEl = lightboxEl.querySelector('.lightbox-img');
        const captionEl = lightboxEl.querySelector('.lightbox-caption');
        const prevBtn = lightboxEl.querySelector('.lightbox-prev');
        const nextBtn = lightboxEl.querySelector('.lightbox-next');
        const backdrop = lightboxEl.querySelector('.lightbox-backdrop');
        const closeBtn = lightboxEl.querySelector('.lightbox-close');

        let images = [];
        let currentIndex = 0;

        function triggerImg(trigger) {
            return trigger.tagName === 'IMG' ? trigger : trigger.querySelector('img');
        }

        function showImage(index) {
            currentIndex = index;
            imgEl.src = images[index].src;
            imgEl.alt = images[index].title;
            captionEl.textContent = images[index].title;
            prevBtn.style.visibility = images.length > 1 ? 'visible' : 'hidden';
            nextBtn.style.visibility = images.length > 1 ? 'visible' : 'hidden';
        }

        function openLightbox(trigger) {
            // La liste est recalculée à l'ouverture : seules les photos visibles
            // (non masquées par le filtre de la galerie) entrent dans le diaporama.
            const visible = triggers.filter(t => t.offsetParent !== null);
            images = visible.map(t => {
                const img = triggerImg(t);
                return { src: img.currentSrc || img.src, title: img.alt || '' };
            });
            if (images.length === 0) return;
            showImage(Math.max(0, visible.indexOf(trigger)));
            lightboxEl.removeAttribute('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightboxEl.setAttribute('hidden', '');
            document.body.style.overflow = '';
        }

        function goToPrev() {
            if (images.length === 0) return;
            showImage((currentIndex - 1 + images.length) % images.length);
        }

        function goToNext() {
            if (images.length === 0) return;
            showImage((currentIndex + 1) % images.length);
        }

        triggers.forEach(trigger => {
            trigger.classList.add('lightbox-trigger');
            trigger.addEventListener('click', (e) => {
                e.preventDefault();
                openLightbox(trigger);
            });
        });

        if (closeBtn) closeBtn.addEventListener('click', closeLightbox);
        if (backdrop) backdrop.addEventListener('click', closeLightbox);
        if (prevBtn) prevBtn.addEventListener('click', (e) => { e.stopPropagation(); goToPrev(); });
        if (nextBtn) nextBtn.addEventListener('click', (e) => { e.stopPropagation(); goToNext(); });

        document.addEventListener('keydown', (e) => {
            if (lightboxEl.hasAttribute('hidden')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') goToPrev();
            if (e.key === 'ArrowRight') goToNext();
        });
    }

    // Blog : filtre par thème et pagination, pilotés par l'URL (/blog/?theme=electricite&page=2).
    // L'URL est la seule source de vérité : chaque clic la met à jour, puis l'affichage en découle.
    // Les liens restent de vrais liens (partage, nouvel onglet, précédent/suivant du navigateur).
    (function () {
        const listing = document.querySelector('.blog-articles');
        if (!listing) return;

        const articles = Array.from(listing.querySelectorAll('.blog-article'));
        const filter = document.querySelector('.blog-filter');
        const chips = Array.from(document.querySelectorAll('.blog-filter__chip'));
        const noResults = document.querySelector('.blog-no-results');
        const status = document.querySelector('.blog-status');
        const pager = document.querySelector('.blog-pager');
        const perPage = Math.max(1, parseInt(listing.dataset.perPage, 10) || 10);
        const themes = chips.map(c => c.dataset.theme);
        const baseTitle = document.title;

        // Thème et page demandés par l'URL, ramenés à des valeurs valides
        function readState() {
            const params = new URLSearchParams(window.location.search);
            const theme = themes.includes(params.get('theme')) ? params.get('theme') : 'tous';
            const matching = articles.filter(a => theme === 'tous' || a.dataset.theme === theme);
            const pageCount = Math.max(1, Math.ceil(matching.length / perPage));
            const asked = parseInt(params.get('page'), 10);
            const page = Math.min(pageCount, Math.max(1, Number.isFinite(asked) ? asked : 1));
            return { theme, page, pageCount, matching };
        }

        // Adresse d'un thème et d'une page. Les valeurs par défaut n'apparaissent pas (/blog/ = tous, page 1).
        function urlFor(theme, page) {
            const params = new URLSearchParams(window.location.search);
            params.delete('theme');
            params.delete('page');
            if (theme !== 'tous') params.set('theme', theme);
            if (page > 1) params.set('page', page);
            const query = params.toString();
            return window.location.pathname + (query ? '?' + query : '');
        }

        // Numéros à afficher : tous jusqu'à 7 pages, sinon la première, la dernière et les voisines
        function pageNumbers(page, pageCount) {
            if (pageCount <= 7) return Array.from({ length: pageCount }, (_, i) => i + 1);
            const wanted = new Set([1, pageCount, page - 1, page, page + 1]);
            const numbers = [];
            for (let n = 1; n <= pageCount; n++) {
                if (!wanted.has(n)) continue;
                if (numbers.length && n - numbers[numbers.length - 1] > 1) numbers.push(null);
                numbers.push(n);
            }
            return numbers;
        }

        function pagerLink(label, theme, page, options) {
            const link = document.createElement('a');
            link.className = 'blog-pager__link' + (options.current ? ' is-current' : '');
            link.href = urlFor(theme, page);
            link.dataset.page = page;
            link.textContent = label;
            if (options.rel) link.rel = options.rel;
            if (options.current) link.setAttribute('aria-current', 'page');
            if (options.label) link.setAttribute('aria-label', options.label);
            return link;
        }

        function render() {
            const { theme, page, pageCount, matching } = readState();
            const first = (page - 1) * perPage;
            const shown = matching.slice(first, first + perPage);

            articles.forEach(a => {
                a.hidden = !shown.includes(a);
                a.classList.remove('is-last-visible');
            });
            shown.forEach(a => a.classList.add('active'));
            if (shown.length) shown[shown.length - 1].classList.add('is-last-visible');
            if (noResults) noResults.hidden = matching.length !== 0;

            chips.forEach(chip => {
                const active = chip.dataset.theme === theme;
                chip.classList.toggle('is-active', active);
                if (active) chip.setAttribute('aria-current', 'true'); else chip.removeAttribute('aria-current');
                chip.href = urlFor(chip.dataset.theme, 1);
            });

            if (status) {
                status.hidden = pageCount < 2;
                status.textContent = 'Articles ' + (first + 1) + ' à ' + (first + shown.length) + ' sur ' + matching.length;
            }

            if (pager) {
                pager.hidden = pageCount < 2;
                pager.textContent = '';
                if (page > 1) pager.appendChild(pagerLink('← Précédent', theme, page - 1, { rel: 'prev', label: 'Page précédente' }));
                pageNumbers(page, pageCount).forEach(n => {
                    if (n === null) {
                        const gap = document.createElement('span');
                        gap.className = 'blog-pager__gap';
                        gap.setAttribute('aria-hidden', 'true');
                        gap.textContent = '…';
                        pager.appendChild(gap);
                    } else {
                        pager.appendChild(pagerLink(String(n), theme, n, {
                            current: n === page,
                            label: n === page ? 'Page ' + n + ', page actuelle' : 'Page ' + n,
                        }));
                    }
                });
                if (page < pageCount) pager.appendChild(pagerLink('Suivant →', theme, page + 1, { rel: 'next', label: 'Page suivante' }));
            }

            document.title = page > 1 ? baseTitle + ' (page ' + page + ')' : baseTitle;

            // Une adresse invalide (thème inconnu, page hors limites) est remplacée par l'adresse réelle
            const canonical = urlFor(theme, page);
            if (canonical !== window.location.pathname + window.location.search) {
                history.replaceState(null, '', canonical + window.location.hash);
            }
            listing.classList.add('is-ready');
        }

        // Clic sur un thème ou une page : on change l'adresse sans recharger, puis on réaffiche
        function navigate(event, toTop) {
            const link = event.target.closest('a');
            if (!link || event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
            event.preventDefault();
            if (link.href !== window.location.href) history.pushState(null, '', link.href);
            render();
            if (toTop && filter) {
                const smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                filter.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
                listing.focus({ preventScroll: true });
            }
        }

        if (filter) filter.addEventListener('click', event => navigate(event, false));
        if (pager) pager.addEventListener('click', event => navigate(event, true));
        window.addEventListener('popstate', render);

        render();
    })();
</script>
