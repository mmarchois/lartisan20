name: Build, Minify & Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install minification tools
        run: npm install -g csso-cli terser html-minifier-terser

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Minify CSS
        run: |
          find _site -name "*.css" -type f | while read file; do
            echo "Minifying CSS: $file"
            csso "$file" -o "$file"
          done

      - name: Minify JS
        run: |
          find _site -name "*.js" -type f | while read file; do
            echo "Minifying JS: $file"
            terser "$file" -o "$file" --compress --mangle
          done

      - name: Minify HTML
        run: |
          find _site -name "*.html" -type f | while read file; do
            echo "Minifying HTML: $file"
            html-minifier-terser \
              --collapse-whitespace \
              --remove-comments \
              --remove-redundant-attributes \
              --remove-script-type-attributes \
              --remove-style-link-type-attributes \
              --minify-css true \
              --minify-js true \
              -o "$file" "$file"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # IndexNow : signale les URL du sitemap à Bing, Yandex, Naver, Seznam et Yep
      # (Bing alimente ChatGPT Search et Copilot). La clé est publique par conception :
      # elle est servie à la racine du site dans <clé>.txt.
      - name: Notify IndexNow
        if: success()
        continue-on-error: true
        env:
          INDEXNOW_KEY: d6385d3add68005906c5dd7d8c3a6ad1
          SITE_HOST: www.lartisan20.fr
        run: |
          curl -fsSL "https://${{ env.SITE_HOST }}/sitemap.xml" \
            | grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g' > urls.txt
          echo "URLs à soumettre : $(wc -l < urls.txt)"
          jq -n \
            --arg host "$SITE_HOST" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "https://${SITE_HOST}/${INDEXNOW_KEY}.txt" \
            --rawfile urls urls.txt \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: ($urls | split("\n") | map(select(length > 0)))}' \
            > indexnow.json
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data @indexnow.json
