<!DOCTYPE html>
<html lang="fr-FR">
<head>
    {% include head.html %}
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Service",
        "@id": "{{ site.url }}{{ page.url }}#service",
        "name": "{{ page.service_name }}",
        "description": "{{ page.description }}",
        "url": "{{ site.url }}{{ page.url }}",
        "provider": {
            "@id": "{{ site.url }}/#organization"
        },
        "areaServed": [
            { "@type": "City", "name": "Paris" },
            { "@type": "State", "name": "Île-de-France" },
            { "@type": "AdministrativeArea", "name": "Hauts-de-Seine (92)" },
            { "@type": "AdministrativeArea", "name": "Seine-Saint-Denis (93)" },
            { "@type": "AdministrativeArea", "name": "Val-de-Marne (94)" }
        ],
        "serviceType": "{{ page.service_type }}",
        "offers": {
            "@type": "Offer",
            "priceCurrency": "EUR",
            "priceSpecification": {
                "@type": "PriceSpecification",
                "priceCurrency": "EUR"
            },
            "availability": "https://schema.org/InStock",
            "url": "{{ site.url }}{{ page.url }}"
        }
    }
    </script>
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "Accueil", "item": "{{ site.url }}/" },
            { "@type": "ListItem", "position": 2, "name": "{{ page.service_name }}", "item": "{{ site.url }}{{ page.url }}" }
        ]
    }
    </script>
</head>
<body>
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-T322KZ9T" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

    <a href="#main-content" class="skip-link">Aller au contenu principal</a>

    {% include nav.html %}

    <main id="main-content">
        {{ content }}

        {% include statut-reconversion.html %}
    </main>

    {% include contact.html %}

    {% include footer.html %}

    <a href="#main-content" class="back-to-top" id="back-to-top" aria-label="Retour en haut de page">↑</a>

    {% include scripts.html %}
</body>
</html>
